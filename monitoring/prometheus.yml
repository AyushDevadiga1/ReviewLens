global:
  scrape_interval: 30s       # how often Prometheus pulls metrics
  evaluation_interval: 30s   # how often rules are evaluated

scrape_configs:

  # Prometheus scrapes itself for meta-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ReviewLens FastAPI — exposes /metrics via prometheus-fastapi-instrumentator
  # Add `prometheus-fastapi-instrumentator` to requirements.txt when wiring this up
  - job_name: reviewlens_api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']   # container name resolves inside Docker network
    scrape_interval: 15s        # tighter interval for API health signals
