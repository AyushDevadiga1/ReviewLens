apiVersion: 1

# Unified-alerting rules, evaluated every 60 s. No contact points are
# provisioned on purpose: rules still evaluate and their FIRING/PENDING
# state is visible in Grafana and via /api/v1/rules. Wire a receiver
# (contact.yaml + policies.yaml) when paging is actually wanted.
groups:
  - orgId: 1
    name: reviewlens
    folder: ReviewLens
    interval: 60s
    rules:
      - uid: api-high-error-rate
        title: API high error rate
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Non-2xx share above 5% for 5 minutes"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                ((sum(rate(http_requests_total{status!~"2.."}[5m]))
                  or vector(0))
                / sum(rate(http_requests_total[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: $A > 0.05

      - uid: api-high-latency
        title: API p95 latency high
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "p95 request latency above 5 s for 5 minutes"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                histogram_quantile(0.95,
                  sum(rate(http_request_duration_seconds_bucket[5m]))
                  by (le))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: $A > 5
